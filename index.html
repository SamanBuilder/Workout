<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="manifest" href="manifest.json">
<title>Workout</title>
<style>
  :root{
    --bg:#faf9f5; --text:#2b2a27; --muted:#78766f; --faint:#b4b1a8;
    --box:#fffefb; --border:#e6e2d8; --field:#f2efe6;
    --accent:#c15f3c; --divider:#ebe7dd;
    --shadow:0 1px 2px rgba(60,55,45,.04);
    --menu-bg:#fffefb; --menu-shadow:0 8px 30px rgba(60,55,45,.14);
    --danger:#b8442e;
    --pick-bg:rgba(250,249,245,.88); --pick-border:#e6e2d8;
    --pick-band:rgba(120,118,111,.10); --pick-shadow:0 10px 34px rgba(60,55,45,.16);
    --sans:"Styrene B",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --serif:"Tiempos Text",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#262624; --text:#f0eee6; --muted:#a3a09a; --faint:#6b6862;
      --box:#30302e; --border:#3d3d3a; --field:#3a3a37;
      --accent:#d97757; --divider:#3a3a37; --shadow:none;
      --menu-bg:#30302e; --menu-shadow:0 10px 34px rgba(0,0,0,.45);
      --danger:#e0715a;
      --pick-bg:rgba(48,48,46,.9); --pick-border:#4a4a46;
      --pick-band:rgba(240,238,230,.09); --pick-shadow:0 12px 38px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;line-height:1.45;}
  .app{max-width:640px;margin:0 auto;min-height:100vh;
    padding:0 20px calc(100px + env(safe-area-inset-bottom)) 20px;}

  header{padding:14px 0 2px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .datebtn{display:flex;align-items:center;gap:7px;border:none;background:transparent;
    color:var(--text);font-size:15px;font-weight:500;cursor:pointer;padding:6px 8px;border-radius:10px;letter-spacing:-.01em;}
  .datebtn:active{background:var(--field)}
  .datebtn svg{color:var(--accent)}
  .hright{display:flex;align-items:center;gap:6px}
  .todaychip{border:none;background:var(--field);color:var(--accent);font-weight:500;
    font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;display:none;}
  .menubtn{width:34px;height:34px;border:none;border-radius:17px;background:transparent;
    color:var(--accent);cursor:pointer;display:grid;place-items:center;}
  .menubtn:active{opacity:.5}
  .planbtn{display:flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--text);
    font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:-.02em;cursor:pointer;padding:4px 6px 4px;border-radius:10px;max-width:100%;}
  .planbtn:active{opacity:.6}
  .planbtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .planbtn .chev{color:var(--muted);font-size:15px;margin-top:3px;flex:none}

  .tabbar{display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:none;border:none;background:var(--field);color:var(--text);font-family:var(--sans);
    font-size:14px;font-weight:500;padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--text);color:var(--bg)}
  .tab-add{flex:none;border:none;background:var(--field);color:var(--accent);
    font-size:19px;font-weight:500;width:40px;height:36px;border-radius:999px;cursor:pointer;}
  .tab-add:active,.tab:active{opacity:.7}

  .blocks{display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .note textarea{width:100%;border:none;outline:none;resize:none;background:transparent;
    font-family:var(--sans);font-size:17px;color:var(--text);line-height:1.5;padding:6px 2px;overflow:hidden;min-height:24px;}
  .note textarea::placeholder{color:var(--faint)}

  .card{background:var(--box);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin:6px 0;}
  .card-head{display:flex;align-items:center;gap:8px;padding:14px 10px 4px 16px}
  .ex-name{flex:1;min-width:0;border:none;outline:none;background:transparent;
    font-family:var(--sans);font-size:18px;font-weight:500;color:var(--text);padding:0;letter-spacing:-.01em;}
  .ex-name::placeholder{color:var(--faint)}
  .del-card{flex:none;width:30px;height:30px;border:none;border-radius:15px;background:transparent;
    color:var(--muted);font-size:15px;cursor:pointer;display:grid;place-items:center;}
  .del-card:active{opacity:.5}
  .ex-desc{display:block;width:100%;border:none;outline:none;background:transparent;
    font-family:var(--sans);font-size:14px;color:var(--muted);padding:0 16px 10px;}
  .ex-desc::placeholder{color:var(--faint)}

  .set-labels{display:grid;grid-template-columns:30px 1fr 1fr 30px;gap:8px;padding:10px 14px 6px;
    color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
    border-top:1px solid var(--divider);margin-top:2px;}
  .set-labels .slbl{display:flex;align-items:center;gap:3px}
  .set-labels .hint{font-size:11px;opacity:.7}
  .set-row{display:grid;grid-template-columns:30px 1fr 1fr 30px;gap:8px;align-items:center;padding:4px 14px;}
  .set-num{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}

  .scrub{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--field);border-radius:10px;height:46px;padding:0 8px;}
  .scrub .cur{width:3ch;min-width:3ch;border:none;background:transparent;outline:none;text-align:center;
    font-size:19px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;cursor:ns-resize;touch-action:none;padding:0;}
  .scrub .cur::placeholder{color:var(--faint);font-weight:500}
  .scrub .unit{font-size:12px;color:var(--muted)}

  .scrub.inline{background:transparent;height:auto;padding:0;gap:3px;display:inline-flex;width:auto;min-width:0;align-items:baseline}
  .scrub.inline .cur{width:2.6ch;min-width:2.6ch;height:auto;padding:0;font-size:19px;font-weight:400;
    border:none;border-radius:0;cursor:ns-resize;font-variant-numeric:tabular-nums;text-align:right;}
  .scrub.inline .unit{font-size:12px;color:var(--muted)}

  .exercise{padding:6px 2px 2px}
  .ex-toprow{display:flex;align-items:flex-start;gap:8px}
  .ex-leftcol{flex:none;width:20px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
  .ex-num{color:var(--text);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.2}
  .ex-right{flex:1;min-width:0}
  .ex-head{display:flex;align-items:baseline;gap:7px}
  .ex-title{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:var(--serif);
    font-size:18px;font-weight:600;color:var(--text);padding:0;letter-spacing:-.01em}
  .ex-sub{display:block;width:100%;text-align:left;border:none;background:transparent;
    -webkit-appearance:none;appearance:none;color:var(--muted);font-size:13px;font-family:var(--sans);
    padding:1px 0 0;font-variant-numeric:tabular-nums;cursor:pointer}
  .ex-sub:active{opacity:.6}
  .ex-sub-edit{display:block;margin:1px 0 0;border:none;outline:none;background:var(--field);
    color:var(--text);font-family:var(--sans);font-size:13px;border-radius:6px;padding:2px 8px;
    width:auto;max-width:160px;font-variant-numeric:tabular-nums}
  .ex-meta{display:flex;align-items:center;gap:8px;padding:3px 0 1px}
  .ex-title::placeholder{color:var(--faint)}
  .ex-more{flex:none;width:28px;height:28px;border:none;border-radius:14px;background:transparent;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;font-size:18px}
  .ex-more:active{background:var(--field)}
  .ex-chev{flex:none;width:22px;height:22px;border:none;background:transparent;color:var(--text);
    cursor:pointer;display:grid;place-items:center;font-size:15px;font-weight:700;transition:transform .18s ease}
  .exercise.collapsed .ex-chev{transform:rotate(-90deg)}
  .exercise.collapsed .ex-body{display:none}
  .ex-body{margin-left:28px;position:relative}
  .ex-line{position:absolute;left:-18px;width:2px;background:var(--border);border-radius:1px;display:none}

  .ex-swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;margin-top:2px}
  .ex-swipe::-webkit-scrollbar{display:none}
  .ex-page{flex:0 0 100%;min-width:100%;scroll-snap-align:start}
  .ex-page:not(:last-child){padding-right:18px}
  .ex-page:not(:first-child){padding-left:18px}
  .ex-dots{display:flex;justify-content:center;gap:5px;padding-top:6px}
  .ex-dots .dot{width:5px;height:5px;border-radius:50%;background:var(--border)}
  .ex-dots .dot.active{background:var(--muted)}

  .ex-chartpanel{padding:2px 0 4px}
  .chart-toggles-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 8px}
  .chart-toggle{display:flex;gap:14px}
  .chart-metric{border:none;background:transparent;color:var(--muted);font-family:var(--sans);
    font-size:12px;cursor:pointer;padding:2px 0}
  .chart-metric.active{color:var(--text);font-weight:600}
  .chart-host{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chart-host::-webkit-scrollbar{display:none}
  .ex-chart-svg{width:100%;height:auto;display:block}
  .ex-chart-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ex-chart-dot{fill:var(--accent)}
  .ex-chart-bar{fill:var(--accent);opacity:.85}
  .ex-chart-barlabel{fill:var(--text);font-size:9px;font-weight:600;font-family:var(--sans)}
  .ex-chart-grid{stroke:var(--divider);stroke-width:.75;opacity:.65}
  .ex-chart-axis{fill:var(--muted);font-size:9px;font-family:var(--sans)}
  .chart-empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:13px;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  .chart-empty span{font-size:12px;color:var(--faint)}

  .ex-calpanel{padding:2px 0 4px}
  .excal-head{display:flex;align-items:center;justify-content:center;gap:14px;padding:2px 0 10px}
  .excal-title{font-size:13px;font-weight:600;color:var(--text);font-family:var(--sans);min-width:104px;text-align:center}
  .excal-nav{border:none;background:var(--field);color:var(--accent);width:24px;height:24px;border-radius:8px;
    font-size:10px;cursor:pointer;display:grid;place-items:center;flex:none}
  .excal-nav:active{opacity:.6}
  .excal-gridwrap{touch-action:pan-x}
  .excal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .excal-dow{font-size:10px;color:var(--muted);text-align:center;padding:2px 0 6px;font-weight:600}
  .excal-day{position:relative;height:32px;display:flex;align-items:center;justify-content:center}
  .excal-day.empty{visibility:hidden}
  .excal-day.trained::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:25px;height:25px;border-radius:50%;background:var(--accent)}
  .excal-num{position:relative;z-index:1;font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
  .excal-day.trained .excal-num{color:#fff}
  .excal-day.future .excal-num{color:var(--faint)}
  .excal-day.today .excal-num{text-decoration:underline;text-decoration-color:var(--accent);
    text-underline-offset:3px;text-decoration-thickness:1.5px}
  .chart-sample-btn{margin-top:10px;border:none;background:var(--field);color:var(--accent);
    font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer}
  .chart-sample-btn:active{opacity:.6}

  .ex-note{width:100%;border:none;outline:none;background:transparent;font-family:var(--sans);
    font-size:13px;color:var(--muted);padding:2px 0}
  .ex-note::placeholder{color:var(--faint)}
  .set-head{display:grid;grid-template-columns:30px 1fr 1fr 26px;gap:8px;padding:8px 12px 4px;
    font-size:11px;color:var(--faint);letter-spacing:.06em}
  .set-head span:nth-child(2),.set-head span:nth-child(3){text-align:center}
  .set-row2{display:grid;grid-template-columns:30px 1fr 1fr 26px;gap:8px;align-items:center;
    background:var(--field);border-radius:10px;padding:9px 12px;margin-bottom:5px}
  .set-idx{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;text-align:left}
  .set-cell{display:flex;align-items:baseline;justify-content:center;gap:3px}
  .del-set2{width:26px;height:26px;border:none;border-radius:7px;background:transparent;color:var(--faint);
    font-size:12px;cursor:pointer;display:grid;place-items:center;opacity:.5}
  .del-set2:active{color:var(--danger);opacity:1;background:var(--box)}
  .add-set2{width:100%;border:none;background:transparent;color:var(--muted);font-family:var(--sans);
    font-size:14px;font-weight:400;cursor:pointer;padding:8px 0 4px;text-align:center;border-radius:10px}
  .add-set2:active{color:var(--accent);background:var(--field)}

  .picker{position:fixed;z-index:100;display:none;border-radius:14px;background:var(--pick-bg);
    box-shadow:var(--pick-shadow);border:1px solid var(--pick-border);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden;}
  .picker.show{display:block}
  .picker-band{position:absolute;left:5px;right:5px;top:50%;height:40px;transform:translateY(-50%);background:var(--pick-band);border-radius:9px;}
  .picker-list{position:absolute;inset:0;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 70%,transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 70%,transparent 100%);}
  .picker-num{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:20px;font-weight:500;
    color:var(--text);font-variant-numeric:tabular-nums;transform-origin:center center;will-change:transform,opacity;}

  .del-set{width:30px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--faint);
    font-size:15px;cursor:pointer;display:grid;place-items:center;}
  .del-set:active{color:var(--danger)}
  .add-set{width:100%;border:none;background:transparent;color:var(--accent);font-family:var(--sans);font-size:15px;
    font-weight:500;cursor:pointer;padding:12px 16px 14px;text-align:left;display:flex;align-items:center;gap:6px;
    border-top:1px solid var(--divider);margin-top:6px;}
  .add-set:active{opacity:.5}
  .add-set .plus{font-size:17px;line-height:1;margin-top:-1px}

  .scrubbing,.scrubbing *{user-select:none!important;-webkit-user-select:none!important}

  .toolbar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 68%,transparent);display:flex;justify-content:center;}
  .add-ex{max-width:600px;width:100%;height:50px;border:none;border-radius:12px;background:var(--accent);color:#fff;
    cursor:pointer;font-family:var(--sans);font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;}
  .add-ex:active{transform:translateY(1px);opacity:.92}
  .add-ex .ic{font-size:19px;line-height:1}

  .menu{position:absolute;top:52px;right:20px;background:var(--menu-bg);border-radius:13px;box-shadow:var(--menu-shadow);
    padding:6px;z-index:60;min-width:200px;display:none;}
  .menu.open{display:block}
  .menu button{width:100%;text-align:left;border:none;background:transparent;cursor:pointer;font-family:var(--sans);
    font-size:16px;color:var(--text);padding:11px 12px;border-radius:8px;}
  .menu button:active{background:var(--field)}
  .menu button.danger{color:var(--danger)}

  .cal-overlay{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.32);padding:20px;}
  .cal-overlay.show{display:flex}
  .cal{width:100%;max-width:340px;background:var(--box);border:1px solid var(--border);border-radius:18px;padding:16px 14px 16px;box-shadow:var(--menu-shadow);}
  .cal-top{display:flex;align-items:center;gap:6px;margin-bottom:14px}
  .cal-month{flex:1;text-align:center;font-family:var(--serif);font-size:16px;font-weight:500;color:var(--text)}
  .cal-nav-btn{flex:none;width:26px;height:26px;border:none;background:var(--field);color:var(--accent);
    border-radius:8px;display:grid;place-items:center;cursor:pointer}
  .cal-nav-btn:active{opacity:.6}
  .cal-today{flex:none;height:26px;padding:0 11px;font-size:12px;border:none;background:var(--field);
    color:var(--accent);border-radius:8px;cursor:pointer;font-weight:600;margin-left:2px}
  .cal-today:active{opacity:.6}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 8px;font-weight:600}
  .cal-day{position:relative;height:38px;border:none;background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .cal-day.empty{visibility:hidden;pointer-events:none}
  .cal-num{position:relative;z-index:1;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
  .cal-day.trained::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:30px;height:30px;border-radius:50%;background:var(--accent)}
  .cal-day.trained .cal-num{color:#fff}
  .cal-day.today .cal-num{text-decoration:underline;text-decoration-color:var(--accent);
    text-underline-offset:3px;text-decoration-thickness:1.5px}
  .cal-day.trained.today .cal-num{text-decoration-color:#fff}
  .cal-day.sel::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 1.5px var(--accent)}

  .modal-overlay{position:fixed;inset:0;z-index:140;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:24px;}
  .modal-overlay.show{display:flex}
  .modal-card{width:100%;max-width:320px;background:var(--box);border-radius:16px;box-shadow:var(--menu-shadow);overflow:hidden;}
  .m-pad{padding:18px}
  .m-title{font-size:16px;font-weight:500;margin-bottom:6px}
  .m-msg{font-size:14px;color:var(--muted);margin-bottom:12px}
  .m-input{width:100%;border:1px solid var(--border);background:var(--field);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--text);outline:none;font-family:var(--sans)}
  .m-input:focus{border-color:var(--accent)}
  .m-actions{display:flex;border-top:1px solid var(--divider)}
  .m-actions button{flex:1;border:none;background:transparent;padding:13px;font-size:16px;color:var(--accent);cursor:pointer;font-weight:500;font-family:var(--sans)}
  .m-actions button:active{background:var(--field)}
  .m-actions button+button{border-left:1px solid var(--divider)}
  .m-actions .danger{color:var(--danger)}
  .m-sheet button{display:block;width:100%;border:none;background:transparent;padding:15px;font-size:16px;color:var(--text);cursor:pointer;border-top:1px solid var(--divider);font-family:var(--sans);text-align:center}
  .m-sheet button:first-child{border-top:none}
  .m-sheet button:active{background:var(--field)}
  .m-sheet .danger{color:var(--danger)}
  .m-sheet .accent{color:var(--accent);font-weight:500}
  .m-sheet .cur-plan{font-weight:500}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.22s;z-index:150;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="hrow">
        <button class="datebtn" id="dateBtn">

<script>
(function(){

  var blocksEl=document.getElementById("blocks"), tabbar=document.getElementById("tabbar");

        n.style.transform="translateY(calc(-50% + "+y.toFixed(1)+"px)) scale("+(1-dist*0.10).toFixed(3)+")";
        n.style.opacity=Math.max(0,1-dist*0.5).toFixed(3); picker.list.appendChild(n); }
      var si=clamp(Math.round(pos)); if(si!==lastInt){ lastInt=si; haptic(); } input.value=String(si); sz(); opts.onChange(input.value); }

    return wrap;
  }

  function parseTarget(str){
    var m=str.match(/(\d{1,2})\s*[x×\*]\s*(\d{1,3})(?:\s*[x×\*]\s*(\d{1,3}))?/i); if(!m) return null;
    var res={ name:str.replace(m[0],"").replace(/\s{2,}/g," ").trim(),

    if(m[3]!==undefined) res.weight=Math.min(999,Math.max(0,parseInt(m[3],10)));
    return res; }

  function targetText(block){

    var parts=[n+(n===1?" set":" sets")];
    var r=parseInt(sets[0].reps,10);
    if(!isNaN(r)) parts.push(r+(r===1?" rep":" reps"));

  }
  function positionLineFor(wrapEl){

    if(!body||!line) return;
    var rows=body.querySelectorAll(".set-row2");
    if(!rows.length || wrapEl.classList.contains("collapsed")){ line.style.display="none"; return; }
    var first=rows[0], last=rows[rows.length-1];

  }
  function render(){ blocksEl.innerHTML=""; var pos=0;
    cur.blocks.forEach(function(b,i){
      if(b.type==="exercise"){ pos++; blocksEl.appendChild(renderExercise(b,pos)); }
      else blocksEl.appendChild(renderText(b,i)); });
    blocksEl.querySelectorAll(".exercise").forEach(positionLineFor);
  }
  function renderText(block,i){ var isEdge=(i===0||i===cur.blocks.length-1); var wrap=el("div","note");
    var ta=document.createElement("textarea"); ta.rows=1; ta.value=block.content||""; ta.placeholder=isEdge?"Notes…":"";
    ta.dataset.blockId=block.id;
    on(ta,"input",function(){ block.content=ta.value; autogrow(ta); persist(); });

      if(e.key==="Backspace" && ta.value==="" && ta.selectionStart===0 && ta.selectionEnd===0){

        e.preventDefault();

        }
      }
    });
    wrap.appendChild(ta); requestAnimationFrame(function(){ autogrow(ta); }); return wrap; }
  function prFor(name){
    var key=(name||"").trim().toLowerCase(); if(!key) return null;
    var best=null, bestDate=null;
    Object.keys(data.sessions).forEach(function(dk){
      var day=data.sessions[dk];
      Object.keys(day).forEach(function(tid){
        (day[tid]||[]).forEach(function(b){
          if(b.type!=="exercise" || (b.name||"").trim().toLowerCase()!==key) return;
          (b.sets||[]).forEach(function(s){
            var w=parseInt(s.weight,10);
            if(!isNaN(w) && w>0 && (best===null || w>best)){ best=w; bestDate=dk; }
          });
        });
      });
    });
    return best===null?null:{weight:best,date:bestDate};
  }
  function exerciseHistory(name,metric){
    var key=(name||"").trim().toLowerCase(); if(!key) return [];
    var byDate={};
    Object.keys(data.sessions).forEach(function(dk){
      var day=data.sessions[dk];
      Object.keys(day).forEach(function(tid){
        (day[tid]||[]).forEach(function(b){
          if(b.type!=="exercise" || (b.name||"").trim().toLowerCase()!==key) return;
          var val=null;
          if(metric==="volume"){
            var vol=0,has=false;
            (b.sets||[]).forEach(function(s){ var w=parseInt(s.weight,10),r=parseInt(s.reps,10);
              if(!isNaN(w)&&!isNaN(r)&&w>0&&r>0){ vol+=w*r; has=true; } });
            if(has) val=vol;
          } else {
            var best=null;
            (b.sets||[]).forEach(function(s){ var w=parseInt(s.weight,10);
              if(!isNaN(w)&&w>0&&(best===null||w>best)) best=w; });
            val=best;
          }
          if(val!==null && val>0){ if(byDate[dk]===undefined||val>byDate[dk]) byDate[dk]=val; }
        });
      });
    });
    return Object.keys(byDate).sort().map(function(dk){ return {date:dk,value:byDate[dk]}; });
  }
  function chartCompactDate(t){ var d=new Date(t); return d.getDate()+"."+(d.getMonth()+1); }
  function niceYTicks(min,max,targetCount){
    var rawStep=(max-min)/(targetCount-1)||1;
    var mag=Math.pow(10,Math.floor(Math.log10(rawStep)));
    var norm=rawStep/mag;
    var step=(norm<1.5?1:(norm<3?2:(norm<7?5:10)))*mag; if(step<1) step=1;
    var niceMin=Math.floor(min/step)*step, niceMax=Math.ceil(max/step)*step;
    if(niceMin===niceMax) niceMax=niceMin+step;
    var out=[]; for(var v=niceMin; v<=niceMax+1e-6; v+=step) out.push(Math.round(v));
    return out;
  }
  function niceXTicks(minT,maxT,targetCount){
    var spanDays=(maxT-minT)/86400000;
    var candidates=[1,2,3,7,14,21,30,60,90,180,365];
    var step=candidates.reduce(function(found,c){ return found!==null?found:(spanDays/c<=targetCount-1?c:null); },null) || candidates[candidates.length-1];
    if(spanDays===0) step=1;
    var out=[]; for(var t=minT;t<=maxT;t+=step*86400000) out.push(t);
    if(out[out.length-1]<maxT-1) out.push(maxT);
    return out;
  }
  var CHART_BASE_W=300, CHART_PX_PER_POINT=34;
  function computeChartScales(history){
    var H=160, padL=30, padR=8, padT=16, padB=32;
    var n=history.length;
    var idealW = padL+padR + (n>1 ? (n-1)*CHART_PX_PER_POINT : 0);
    var W = Math.max(CHART_BASE_W, idealW);
    var scrollable = W>CHART_BASE_W;
    var innerW=W-padL-padR, innerH=H-padT-padB;
    var vals=history.map(function(p){return p.value;});
    var vMin=Math.min.apply(null,vals), vMax=Math.max.apply(null,vals);
    if(vMin===vMax){ var vpad=Math.max(1,Math.round(vMax*0.1)); vMin-=vpad; vMax+=vpad; }
    var times=history.map(function(p){ return parseKey(p.date).getTime(); });
    var minT=times[0], maxT=times[n-1];

    var yVals=niceYTicks(vMin,vMax,4);
    var yLo=yVals[0], yHi=yVals[yVals.length-1], yRange=yHi-yLo;
    function y(v){ return padT+innerH-((v-yLo)/yRange)*innerH; }
    function xt(t){ return (maxT===minT)? padL+innerW/2 : padL+((t-minT)/(maxT-minT))*innerW; }
    function x(i){ return xt(times[i]); }

    var grid="", yLabels="";
    yVals.forEach(function(v){
      var yy=y(v);
      grid+='<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(padL+innerW)+'" y2="'+yy.toFixed(1)+'" class="ex-chart-grid"/>';
      yLabels+='<text x="0" y="'+(yy+3).toFixed(1)+'" class="ex-chart-axis">'+v+'</text>';
    });

    var spacePerPoint = n>1 ? innerW/(n-1) : innerW;
    var rotate = spacePerPoint<28;
    var xLabels="";
    history.forEach(function(p,i){
      var px=x(i);
      grid+='<line x1="'+px.toFixed(1)+'" y1="'+padT+'" x2="'+px.toFixed(1)+'" y2="'+(padT+innerH)+'" class="ex-chart-grid"/>';
      var label=chartCompactDate(times[i]);
      if(rotate){
        xLabels+='<text x="'+px.toFixed(1)+'" y="'+(H-6)+'" class="ex-chart-axis" text-anchor="end" transform="rotate(-55 '+px.toFixed(1)+' '+(H-6)+')">'+label+'</text>';
      } else {
        var anchor=(i===0?"start":(i===n-1?"end":"middle"));
        xLabels+='<text x="'+px.toFixed(1)+'" y="'+(H-6)+'" class="ex-chart-axis" text-anchor="'+anchor+'">'+label+'</text>';
      }
    });
    return {W:W,H:H,padL:padL,padT:padT,innerW:innerW,innerH:innerH,x:x,y:y,yLo:yLo,n:n,
      grid:grid,yLabels:yLabels,xLabels:xLabels,scrollable:scrollable};
  }
  function svgOpenTag(s){
    var w = s.scrollable ? (s.W+"px") : "100%";
    return '<svg viewBox="0 0 '+s.W+' '+s.H+'" class="ex-chart-svg" style="width:'+w+';height:auto;display:block" preserveAspectRatio="xMidYMid meet">';
  }
  function buildLineSVG(history){
    var s=computeChartScales(history);
    var pathD="",dots="";
    history.forEach(function(p,i){ var px=s.x(i),py=s.y(p.value);
      pathD+=(i===0?"M":"L")+px.toFixed(1)+","+py.toFixed(1)+" ";
      dots+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3" class="ex-chart-dot"/>'; });
    return svgOpenTag(s)
      +s.grid
      +(s.n>1?'<path d="'+pathD.trim()+'" class="ex-chart-line"/>':'')
      +dots+s.yLabels+s.xLabels
      +'</svg>';
  }
  function buildBarSVG(history){
    var s=computeChartScales(history);
    var barW=Math.max(4,Math.min(16,(s.innerW/s.n)*0.55));
    var baseY=s.y(s.yLo);
    var bars="",labels="";

      labels+='<text x="'+cx.toFixed(1)+'" y="'+(topY-4).toFixed(1)+'" text-anchor="middle" class="ex-chart-barlabel">'+p.value+'</text>';
    });

  var chartMetric={}, chartType={};
  function renderChartInto(chartHost,block){
    var metric=chartMetric[block.id]||"top";
    var type=chartType[block.id]||"line";
    var hist=exerciseHistory(block.name,metric);
    chartHost.innerHTML="";
    if(hist.length){ chartHost.innerHTML = type==="bars"?buildBarSVG(hist):buildLineSVG(hist); return; }
    var empty=el("div","chart-empty");
    var t1=document.createElement("div"); t1.textContent="No history yet";

  function buildExerciseCalendar(block){
    var panel=el("div","ex-calpanel");
    var head=el("div","excal-head");
    var upBtn=el("button","excal-nav"); upBtn.type="button"; upBtn.innerHTML="▲"; upBtn.setAttribute("aria-label","Previous month");
    var title=el("div","excal-title");
    var downBtn=el("button","excal-nav"); downBtn.type="button"; downBtn.innerHTML="▼"; downBtn.setAttribute("aria-label","Next month");
    head.appendChild(upBtn); head.appendChild(title); head.appendChild(downBtn);
    panel.appendChild(head);
    var gridWrap=el("div","excal-gridwrap");
    panel.appendChild(gridWrap);

    function view(){
      if(!exCalView[block.id]){ var d=new Date(); exCalView[block.id]={y:d.getFullYear(),m:d.getMonth()}; }
      return exCalView[block.id];
    }
    function draw(){
      var v=view();
      title.textContent=new Date(v.y,v.m,1).toLocaleDateString([], {month:"long",year:"numeric"});
      gridWrap.innerHTML="";
      var trained=exerciseTrainedDates(block.name);
      var tKey=todayKey();
      var grid=el("div","excal-grid");
      ["S","M","T","W","T","F","S"].forEach(function(d){ var c=el("div","excal-dow"); c.textContent=d; grid.appendChild(c); });
      var first=new Date(v.y,v.m,1).getDay();
      var days=new Date(v.y,v.m+1,0).getDate();
      for(var i=0;i<first;i++) grid.appendChild(el("div","excal-day empty"));
      for(var day=1; day<=days; day++){
        var key=v.y+"-"+pad(v.m+1)+"-"+pad(day);
        var cell=el("div","excal-day");
        var num=el("span","excal-num"); num.textContent=day; cell.appendChild(num);
        if(trained[key]) cell.classList.add("trained");
        if(key===tKey) cell.classList.add("today");
        if(key>tKey) cell.classList.add("future");
        grid.appendChild(cell);
      }
      gridWrap.appendChild(grid);
    }
    function go(delta){
      var v=view(); v.m+=delta;
      if(v.m<0){ v.m=11; v.y--; } if(v.m>11){ v.m=0; v.y++; }
      draw();
    }
    on(upBtn,"click",function(){ go(-1); });
    on(downBtn,"click",function(){ go(1); });

    var startY=0,startX=0,dragging=false,moved=false;
    on(gridWrap,"pointerdown",function(e){ startY=e.clientY; startX=e.clientX; dragging=true; moved=false; });
    on(gridWrap,"pointermove",function(e){
      if(!dragging) return;
      var dy=e.clientY-startY, dx=e.clientX-startX;
      if(!moved && Math.abs(dy)>8 && Math.abs(dy)>Math.abs(dx)) moved=true;
      if(moved) e.preventDefault();
    });
    on(gridWrap,"pointerup",function(e){
      if(!dragging) return; dragging=false;
      if(moved){ var dy=e.clientY-startY; if(Math.abs(dy)>30){ if(dy<0) go(1); else go(-1); } }
      moved=false;
    });
    on(gridWrap,"pointercancel",function(){ dragging=false; moved=false; });

    draw();
    return panel;
  }

    label.textContent=new Date(calView.y,calView.m,1).toLocaleDateString([], {month:"long",year:"numeric"});
    var next=el("button","cal-nav-btn"); next.type="button"; next.setAttribute("aria-label","Next month");
    next.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
    on(next,"click",function(){ calView.m++; if(calView.m>11){calView.m=0;calView.y++;} renderCal(); });
    var today=el("button","cal-today"); today.type="button"; today.textContent="Today"; on(today,"click",function(){ selectDate(todayKey()); });
    top.appendChild(prev); top.appendChild(label); top.appendChild(next); top.appendChild(today);
    calEl.appendChild(top);
    var grid=el("div","cal-grid");
    ["S","M","T","W","T","F","S"].forEach(function(d){ var c=el("div","cal-dow"); c.textContent=d; grid.appendChild(c); });
    var first=new Date(calView.y,calView.m,1).getDay(), days=new Date(calView.y,calView.m+1,0).getDate();
    for(var i=0;i<first;i++) grid.appendChild(el("div","cal-day empty"));
    for(var day=1;day<=days;day++){ var key=calView.y+"-"+pad(calView.m+1)+"-"+pad(day);
      var b=el("button","cal-day");
      var num=el("span","cal-num"); num.textContent=day; b.appendChild(num);
      if(data.sessions[key]) b.classList.add("trained");
      if(key===todayKey()) b.classList.add("today");
      if(key===cur.date) b.classList.add("sel");
      (function(k){ on(b,"click",function(){ selectDate(k); }); })(key); grid.appendChild(b); }
    calEl.appendChild(grid);
  }
  function selectDate(key){ cur.date=key; var plan=planForDate(key); cur.planId=plan.id;
    var day=data.sessions[key]; var ids=plan.tabs.map(function(t){return t.id;});
    cur.tabId=(day && ids.filter(function(id){return day[id];})[0]) || plan.tabs[0].id;
    loadCur(); closeCal(); renderAll(); }

  // ---- modals ----
  var modalOverlay=document.getElementById("modalOverlay"), modalCard=document.getElementById("modalCard");
  function closeModal(){ modalOverlay.classList.remove("show"); modalCard.innerHTML=""; }
  on(modalOverlay,"click",function(e){ if(e.target===modalOverlay) closeModal(); });
  function openInput(title,value,placeholder,onSave){ modalCard.innerHTML="";
    var pad=el("div","m-pad"); var t=el("div","m-title"); t.textContent=title; pad.appendChild(t);
    var inp=document.createElement("input"); inp.className="m-input"; inp.value=value||""; inp.placeholder=placeholder||"";
    pad.appendChild(inp); modalCard.appendChild(pad);
    var acts=el("div","m-actions"); var cancel=el("button"); cancel.textContent="Cancel"; on(cancel,"click",closeModal);
    var save=el("button"); save.textContent="Save";
    function go(){ var v=inp.value.trim(); if(!v){ inp.focus(); return; } closeModal(); onSave(v); }
    on(save,"click",go); on(inp,"keydown",function(e){ if(e.key==="Enter") go(); });
    acts.appendChild(cancel); acts.appendChild(save); modalCard.appendChild(acts);
    modalOverlay.classList.add("show"); setTimeout(function(){ inp.focus(); },50);
  }
  function openConfirm(title,msg,confirmLabel,onYes){ modalCard.innerHTML="";
    var pad=el("div","m-pad"); var t=el("div","m-title"); t.textContent=title; pad.appendChild(t);
    var m=el("div","m-msg"); m.textContent=msg; m.style.marginBottom="0"; pad.appendChild(m); modalCard.appendChild(pad);
    var acts=el("div","m-actions"); var cancel=el("button"); cancel.textContent="Cancel"; on(cancel,"click",closeModal);
    var yes=el("button","danger"); yes.textContent=confirmLabel||"OK"; on(yes,"click",function(){ closeModal(); onYes(); });
    acts.appendChild(cancel); acts.appendChild(yes); modalCard.appendChild(acts); modalOverlay.classList.add("show");
  }
  function sheet(items){ modalCard.innerHTML=""; var wrap=el("div","m-sheet");
    items.forEach(function(it){ var b=el("button",it.cls||""); b.textContent=it.label; on(b,"click",function(){ closeModal(); it.fn(); }); wrap.appendChild(b); });
    var cancel=el("button"); cancel.textContent="Cancel"; on(cancel,"click",closeModal); wrap.appendChild(cancel);
    modalCard.appendChild(wrap); modalOverlay.classList.add("show");
  }

  var menu=document.getElementById("menu");
  on(document.getElementById("menuBtn"),"click",function(e){ e.stopPropagation(); menu.classList.toggle("open"); });
  on(document,"click",function(){ menu.classList.remove("open"); });
  on(document.getElementById("copyBtn"),"click",function(){ var txt=planToText();
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){toast("Copied");},function(){fallbackCopy(txt);});
    else fallbackCopy(txt); });
  function fallbackCopy(txt){ var t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Couldn't copy"); } document.body.removeChild(t); }

  on(document.getElementById("backupBtn"),"click",function(){
    var payload={ app:"workout-backup", version:2, exportedAt:new Date().toISOString(), data:data };
    var blob=new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    var d=new Date(); var stamp=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    a.href=url; a.download="workout-backup-"+stamp+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("Backup downloaded");
  });

  var restoreFileInput=document.getElementById("restoreFile");
  on(document.getElementById("restoreBtn"),"click",function(){ restoreFileInput.value=""; restoreFileInput.click(); });
  on(restoreFileInput,"change",function(){
    var file=restoreFileInput.files && restoreFileInput.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(){
      var parsed;
      try{ parsed=JSON.parse(reader.result); }catch(e){ toast("That file isn't valid"); return; }
      var incoming = parsed && parsed.data ? parsed.data : parsed;
      if(!incoming || !Array.isArray(incoming.plans) || typeof incoming.sessions!=="object"){
        toast("Not a workout backup file"); return;
      }
      openConfirm("Restore backup","This replaces everything currently in the app with the backup. This can't be undone.","Restore",function(){
        data=incoming;
        if(!data.plans.length) data=fresh();
        data.sessions=data.sessions||{};
        cur.date=todayKey();
        var p0=planForDate(cur.date); cur.planId=p0.id;
        var d0=data.sessions[cur.date]; var ids0=p0.tabs.map(function(t){return t.id;});
        cur.tabId=(d0 && ids0.filter(function(id){return d0[id];})[0]) || p0.tabs[0].id;
        loadCur(); renderAll(); saveRaw();
        toast("Backup restored");
      });
    };
    reader.readAsText(file);
  });

  on(document.getElementById("clearWeightsBtn"),"click",function(){
    openConfirm("Clear weights","Empty all weights for this day?","Clear",function(){
      cur.blocks.forEach(function(b){ if(b.type==="exercise") b.sets.forEach(function(s){ s.weight=""; }); });
      persist(); render(); toast("Weights cleared"); }); });
  function planToText(){ var out=[]; var plan=currentPlan(), tab=null; plan.tabs.forEach(function(t){ if(t.id===cur.tabId) tab=t; });
    out.push(plan.name.toUpperCase()+" · "+(tab?tab.name:"")+" — "+fmtDate(cur.date)); out.push("");
    cur.blocks.forEach(function(b){ if(b.type==="exercise"){ out.push((b.name||"Exercise")+(b.desc?"  — "+b.desc:""));
        b.sets.forEach(function(s,i){ out.push("  "+(i+1)+".  "+(s.reps||"–")+" reps × "+(s.weight?s.weight+" kg":"–")); }); out.push("");
      } else if(b.content&&b.content.trim()){ out.push(b.content); out.push(""); } });
    return out.join("\n").trim(); }

  // ---- init ----
  data = loadRaw() || migrateV3() || migrateV2() || fresh();
  if(!data.plans || !data.plans.length) data=fresh();
  data.sessions=data.sessions||{};
  cur.date=todayKey(); var p0=planForDate(cur.date); cur.planId=p0.id;
  var d0=data.sessions[cur.date]; var ids0=p0.tabs.map(function(t){return t.id;});
  cur.tabId=(d0 && ids0.filter(function(id){return d0[id];})[0]) || p0.tabs[0].id;
  loadCur(); renderAll(); saveRaw();
})();
</script>
</body>
</html>
